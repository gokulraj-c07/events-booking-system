<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Transaction Detail - Admin</title>
    <th:block th:replace="~{admin-layout :: head}"></th:block>
</head>

<body class="bg-gray-50 font-sans text-gray-900 antialiased overflow-x-hidden">
    <div class="flex min-h-screen">
        <aside th:replace="~{admin-layout :: sidebar}"></aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header th:replace="~{admin-layout :: topbar}"></header>

            <main class="flex-1 p-8 overflow-y-auto">
                <div class="mb-10">
                    <a href="/admin/payments"
                        class="text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-indigo-600 transition-colors flex items-center gap-2 mb-2">
                        <div class="icon-arrow-left"></div> Back to Ledger
                    </a>
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Transaction Analytics</h1>
                </div>

                <div class="max-w-4xl mx-auto">
                    <div class="bg-white rounded-3xl border border-gray-100 shadow-xl overflow-hidden">
                        <div class="p-10 bg-indigo-600 flex items-center justify-between text-white">
                            <div>
                                <div class="text-[10px] font-bold uppercase tracking-widest opacity-60 mb-1">Transaction
                                    ID</div>
                                <div class="text-2xl font-black font-mono" th:text="${payment.transactionId}">TXN_000
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] font-bold uppercase tracking-widest opacity-60 mb-1">Settlement
                                    Date</div>
                                <div class="text-sm font-bold" th:text="${payment.createAt}">Date</div>
                            </div>
                        </div>

                        <div class="p-10">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                                <div class="space-y-8">
                                    <div class="space-y-4">
                                        <h3
                                            class="text-xs font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                            <div class="icon-user text-indigo-500"></div> Payer Information
                                        </h3>
                                        <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100">
                                            <div class="text-lg font-bold text-gray-900"
                                                th:text="${payment.booking.user.name}">Name</div>
                                            <div class="text-sm text-gray-500"
                                                th:text="${payment.booking.user.emailId}">Email</div>
                                        </div>
                                    </div>

                                    <div class="space-y-4">
                                        <h3
                                            class="text-xs font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                            <div class="icon-briefcase text-indigo-500"></div> Linked Service
                                        </h3>
                                        <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100">
                                            <div class="text-lg font-bold text-gray-900"
                                                th:text="${payment.booking.service.serviceName}">Service</div>
                                            <div class="text-sm text-gray-500">Provided by <span
                                                    th:text="${payment.booking.provider.name}"></span></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-8">
                                    <div class="bg-indigo-50/50 rounded-3xl p-8 border border-indigo-100 space-y-6">
                                        <div class="space-y-2">
                                            <div
                                                class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">
                                                Protocol & Method</div>
                                            <div class="flex items-center gap-3">
                                                <div th:switch="${payment.paymentMethod}">
                                                    <div th:case="'CARD'"
                                                        class="flex items-center gap-2 text-indigo-700 font-bold">
                                                        <div class="icon-credit-card"></div> Credit Card
                                                    </div>
                                                    <div th:case="'UPI'"
                                                        class="flex items-center gap-2 text-indigo-700 font-bold">
                                                        <div class="icon-smartphone"></div> UPI Payment
                                                    </div>
                                                    <div th:case="*"
                                                        class="flex items-center gap-2 text-indigo-700 font-bold">
                                                        <div class="icon-banknote"></div> <span
                                                            th:text="${payment.paymentMethod}"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="space-y-2">
                                            <div
                                                class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">
                                                Network Status</div>
                                            <div
                                                class="inline-flex items-center gap-2 px-3 py-1 bg-green-500 text-white rounded-full text-[10px] font-bold uppercase tracking-wider">
                                                <div class="icon-check-circle"></div> <span
                                                    th:text="${payment.paymentStatus}">SUCCESS</span>
                                            </div>
                                        </div>

                                        <div class="pt-6 border-t border-indigo-100">
                                            <div
                                                class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-1">
                                                Total Settled</div>
                                            <div class="text-4xl font-black text-indigo-600"
                                                th:text="'₹' + ${payment.amountPaid}">₹0</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="px-10 py-6 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Internal DB
                                Pointer: <span th:text="${payment.paymentId}"></span></span>
                            <div class="flex items-center gap-4">
                                <button
                                    class="text-xs font-bold text-gray-500 hover:text-indigo-600 transition-colors">Export
                                    Receipt</button>
                                <button
                                    class="text-xs font-bold text-gray-500 hover:text-red-600 transition-colors">Void
                                    Transaction</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:insert="~{admin-layout :: scripts}"></th:block>
</body>

</html>
