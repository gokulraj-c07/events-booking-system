<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link href="/styles/main.css" rel="stylesheet">
    <style>
        .admin-sidebar-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: #6366f1;
            border-right: 4px solid #6366f1;
        }
    </style>
</head>

<body>
    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar"
        class="w-64 bg-white border-r border-gray-100 hidden lg:flex flex-col sticky top-0 h-screen z-40">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-10">
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-br from-gray-800 to-black flex items-center justify-center shadow-lg">
                    <div class="icon-shield text-xl text-white"></div>
                </div>
                <span class="text-xl font-bold tracking-tight">Admin <span class="text-gray-400 font-medium">Event
                        Hub</span></span>
            </div>

            <nav class="space-y-1">
                <a th:href="@{/admin/dashboard}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-layout text-lg group-hover:text-indigo-600"></div> Dashboard
                </a>
                <a th:href="@{/admin/users}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-users text-lg group-hover:text-indigo-600"></div> Users
                </a>
                <a th:href="@{/admin/services}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-layers text-lg group-hover:text-indigo-600"></div> All Services
                </a>
                <a th:href="@{/admin/pending-services}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-check-square text-lg group-hover:text-indigo-600"></div> Approval Queue
                </a>
                <a th:href="@{/admin/booking}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-calendar text-lg group-hover:text-indigo-600"></div> Bookings
                </a>
                <a th:href="@{/admin/payments}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-credit-card text-lg group-hover:text-indigo-600"></div> Payments
                </a>
                <a th:href="@{/admin/bills}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-receipt text-lg group-hover:text-indigo-600"></div> Invoices
                </a>
                <a th:href="@{/admin/feedback}"
                    class="admin-sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group">
                    <div class="icon-star text-lg group-hover:text-indigo-600"></div> Reviews
                </a>
            </nav>
        </div>
    </aside>

    <!-- Topbar Fragment -->
    <header th:fragment="topbar"
        class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-30">
        <div class="flex items-center gap-4">
            <button class="lg:hidden text-gray-500">
                <div class="icon-menu text-xl"></div>
            </button>
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest hidden md:block">Administrator Panel
            </h2>
        </div>

        <div class="flex items-center gap-6">
            <div class="relative hidden sm:block">
                <a th:href="@{/admin/logout}"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-red-500 hover:bg-red-50 transition-all">
                    <div class="icon-log-out text-lg"></div> Logout
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div
                    class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 font-bold border border-indigo-100 uppercase">
                    A
                </div>
            </div>
        </div>
    </header>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const currentPath = window.location.pathname;
                const items = document.querySelectorAll('.admin-sidebar-item');
                items.forEach(item => {
                    if (item.getAttribute('href') === currentPath) {
                        item.classList.add('active');
                        item.classList.remove('text-gray-500');
                    }
                });
            });
        </script>
        <script src="/script/app.js"></script>
    </div>
</body>

</html>
