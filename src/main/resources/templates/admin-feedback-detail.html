<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Feedback Details - Admin</title>
    <th:block th:replace="~{admin-layout :: head}"></th:block>
</head>

<body class="bg-gray-50 font-sans text-gray-900 antialiased overflow-x-hidden">
    <div class="flex min-h-screen">
        <aside th:replace="~{admin-layout :: sidebar}"></aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header th:replace="~{admin-layout :: topbar}"></header>

            <main class="flex-1 p-8 overflow-y-auto">
                <div class="mb-10 flex items-center justify-between">
                    <div>
                        <a href="/admin/feedback"
                            class="text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-indigo-600 transition-colors flex items-center gap-2 mb-2">
                            <div class="icon-arrow-left"></div> Back to Feedback
                        </a>
                        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Review Inspection</h1>
                    </div>
                </div>

                <div class="max-w-4xl mx-auto">
                    <div class="bg-white rounded-3xl border border-gray-100 shadow-xl overflow-hidden">
                        <!-- Rating Header -->
                        <div class="p-10 bg-indigo-600 text-white flex items-center justify-between">
                            <div>
                                <div class="text-[10px] font-bold uppercase tracking-widest opacity-60 mb-1">Feedback ID
                                </div>
                                <div class="text-2xl font-black font-mono" th:text="'#FB-' + ${feedback.id}">#FB-000
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="flex items-center gap-1">
                                    <div th:each="i : ${#numbers.sequence(1, 5)}" class="icon-star-full text-xl"
                                        th:classappend="${i <= feedback.rating ? 'text-yellow-400' : 'text-indigo-400 opacity-30'}">
                                    </div>
                                </div>
                                <div class="text-3xl font-black ml-2" th:text="${feedback.rating}">5</div>
                            </div>
                        </div>

                        <div class="p-10">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                                <div class="space-y-8">
                                    <div class="space-y-4">
                                        <h3
                                            class="text-xs font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                            <div class="icon-user text-indigo-500"></div> Customer Info
                                        </h3>
                                        <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100">
                                            <div class="text-lg font-bold text-gray-900"
                                                th:text="${feedback.user.name}">Name</div>
                                            <div class="text-sm text-gray-500" th:text="${feedback.user.emailId}">Email
                                            </div>
                                        </div>
                                    </div>

                                    <div class="space-y-4">
                                        <h3
                                            class="text-xs font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                            <div class="icon-zap-bolt text-indigo-500"></div> Linked Service
                                        </h3>
                                        <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100">
                                            <div class="text-lg font-bold text-indigo-600"
                                                th:text="${feedback.booking.service.serviceName}">Service</div>
                                            <div class="text-sm text-gray-500">Provided by <span
                                                    th:text="${feedback.booking.provider.name}"></span></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-8">
                                    <div class="space-y-4">
                                        <h3
                                            class="text-xs font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                            <div class="icon-message-square text-indigo-500"></div> Full Review Comment
                                        </h3>
                                        <div class="p-8 bg-indigo-50/30 rounded-3xl border border-indigo-100 relative">
                                            <div class="icon-quote text-4xl text-indigo-100 absolute top-4 left-4">
                                            </div>
                                            <p class="text-gray-700 leading-relaxed relative z-10 italic"
                                                th:text="${feedback.comment}">
                                                No comment provided.
                                            </p>
                                        </div>
                                    </div>

                                    <div class="pt-6 border-t border-gray-100">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <div
                                                    class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">
                                                    Submission Time</div>
                                                <div class="text-sm font-bold text-gray-900"
                                                    th:text="${#temporals.format(feedback.createdAt, 'dd MMMM yyyy HH:mm')}">
                                                    Date</div>
                                            </div>
                                            <div class="text-right">
                                                <div
                                                    class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">
                                                    Booking Link</div>
                                                <a th:href="@{'/admin/booking/' + ${feedback.booking.bookingId} + '/view'}"
                                                    class="text-xs font-bold text-indigo-600 hover:underline">View
                                                    Booking #<span th:text="${feedback.booking.bookingId}"></span></a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="px-10 py-6 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Internal ID:
                                <span th:text="${feedback.id}"></span></span>
                            <div class="flex items-center gap-4">
                                <button
                                    class="text-xs font-bold text-gray-500 hover:text-red-600 transition-colors flex items-center gap-1">
                                    <div class="icon-trash-2"></div> Delete Review
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:insert="~{admin-layout :: scripts}"></th:block>
</body>

</html>
