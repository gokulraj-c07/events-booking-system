<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Payment Records - Admin</title>
    <th:block th:replace="~{admin-layout :: head}"></th:block>
</head>

<body class="bg-gray-50 font-sans text-gray-900 antialiased overflow-x-hidden">
    <div class="flex min-h-screen">
        <aside th:replace="~{admin-layout :: sidebar}"></aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header th:replace="~{admin-layout :: topbar}"></header>

            <main class="flex-1 p-8 overflow-y-auto">
                <div class="mb-10">
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Payment Ledger</h1>
                    <p class="text-gray-500 mt-1">Detailed history of all financial transactions on EventHub.</p>
                </div>

                <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-gray-50 flex items-center justify-between">
                        <h2 class="text-lg font-bold text-gray-900">Transaction History</h2>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-400">Records:</span>
                            <span class="px-3 py-1 bg-gray-50 rounded-lg text-sm font-bold text-gray-900"
                                th:text="${payments.size()}">0</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50/50">
                                <tr>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        Transaction ID</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        Customer</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">
                                        Protocol</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">
                                        Settlement Date</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">
                                        Settled Amount</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">
                                        View</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">
                                        Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-50">
                                <tr th:each="p : ${payments}" class="hover:bg-gray-50/50 transition-colors">
                                    <td class="px-6 py-4">
                                        <span class="text-xs font-bold text-gray-900 tracking-wider"
                                            th:text="'#' + ${p.paymentId}">ID</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-2">
                                            <div class="w-7 h-7 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-[10px] font-bold border border-blue-100 uppercase"
                                                th:text="${#strings.substring(p.booking.user.name,0,1)}">C</div>
                                            <span class="text-sm font-bold text-gray-700"
                                                th:text="${p.booking.user.name}">Customer</span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-center">
                                        <div
                                            class="inline-flex items-center gap-1.5 px-3 py-1 bg-gray-50 text-gray-600 rounded-full text-[10px] font-bold uppercase tracking-wider border border-gray-100">
                                            <div th:switch="${p.paymentMethod}">
                                                <div th:case="'CARD'" class="flex items-center gap-1.5">
                                                    <div class="icon-credit-card text-xs"></div> CARD
                                                </div>
                                                <div th:case="'UPI'" class="flex items-center gap-1.5">
                                                    <div class="icon-smartphone text-xs"></div> UPI
                                                </div>
                                                <div th:case="*" class="flex items-center gap-1.5">
                                                    <div class="icon-banknote text-xs"></div> <span
                                                        th:text="${p.paymentMethod}">Other</span>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-center">
                                        <span class="text-xs font-bold text-gray-400"
                                            th:text="${#temporals.format(p.createAt, 'dd-MM-yyyy HH:mm')}">Date</span>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <span class="text-sm font-extrabold text-indigo-600"
                                            th:text="'₹' + ${p.amountPaid}">Amount</span>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <a th:href="@{'/admin/payment/' + ${p.paymentId} + '/view'}"
                                            class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
                                            Details <div class="icon-external-link text-xs"></div>
                                        </a>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button class="text-gray-400 hover:text-red-500 transition-colors">
                                            <div class="icon-trash-2 text-lg"></div>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:insert="~{admin-layout :: scripts}"></th:block>
</body>

</html>
