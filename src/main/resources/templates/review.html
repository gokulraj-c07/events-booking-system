<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Successful - EventHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles/main.css" rel="stylesheet">
</head>

<body class="bg-gray-50 font-sans text-gray-900 antialiased flex flex-col min-h-screen">
    <div id="app" class="flex-grow flex items-center justify-center py-12 px-4">
        <!-- Success Card -->
        <div
            class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-gray-100 p-10 text-center animate-fade-in">
            <div class="mb-8 relative inline-block">
                <div
                    class="w-24 h-24 rounded-full bg-green-50 flex items-center justify-center mx-auto ring-8 ring-green-50/50">
                    <div class="icon-check-circle-2 text-5xl text-green-500 animate-bounce"></div>
                </div>
                <!-- Mini elements for flair -->
                <div class="absolute -top-2 -right-2 w-4 h-4 bg-indigo-400 rounded-full animate-ping"></div>
                <div class="absolute -bottom-1 -left-1 w-3 h-3 bg-purple-400 rounded-full animate-pulse"></div>
            </div>

            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-4">Great Success!</h1>

            <div th:if="${success}"
                class="p-4 bg-green-50 rounded-2xl border border-green-100 text-green-700 font-medium mb-8 leading-relaxed"
                th:text="${success}">
                Your action was completed successfully.
            </div>

            <p class="text-gray-500 mb-10 leading-relaxed">
                Thank you for choosing EventHub. We've processed your request and you can now continue exploring or
                manage your details in the dashboard.
            </p>

            <div class="space-y-4">
                <a th:href="@{/}"
                    class="block w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 transition-all hover:-translate-y-1 active:translate-y-0">
                    Go to Homepage
                </a>
                <a th:href="@{/userdashboard}"
                    class="block w-full py-4 bg-white border-2 border-gray-100 text-gray-700 hover:bg-gray-50 font-bold rounded-2xl transition-all">
                    View My Dashboard
                </a>
            </div>

            <div class="mt-12 pt-8 border-t border-gray-50 flex items-center justify-center gap-6">
                <div class="flex flex-col items-center gap-1 group">
                    <div
                        class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-all">
                        <div class="icon-share-2 text-lg"></div>
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Share</span>
                </div>
                <div class="flex flex-col items-center gap-1 group">
                    <div
                        class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-all">
                        <div class="icon-download text-lg"></div>
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Receipt</span>
                </div>
                <div class="flex flex-col items-center gap-1 group">
                    <div
                        class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-all">
                        <div class="icon-help-circle text-lg"></div>
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Support</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Simple Footer -->
    <footer class="py-8 text-center text-xs text-gray-400 font-medium">
        &copy; 2025 EventHub. Making every event memorable.
    </footer>

    <script src="/script/app.js"></script>
</body>

</html>
