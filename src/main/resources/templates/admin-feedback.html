<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Customer Feedback - Admin</title>
    <th:block th:replace="~{admin-layout :: head}"></th:block>
</head>

<body class="bg-gray-50 font-sans text-gray-900 antialiased overflow-x-hidden">
    <div class="flex min-h-screen">
        <aside th:replace="~{admin-layout :: sidebar}"></aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header th:replace="~{admin-layout :: topbar}"></header>

            <main class="flex-1 p-8 overflow-y-auto">
                <div class="mb-10">
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Customer Reviews</h1>
                    <p class="text-gray-500 mt-1">Listen to what users have to say about the services.</p>
                </div>

                <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-gray-50 flex items-center justify-between">
                        <h2 class="text-lg font-bold text-gray-900">All Feedback</h2>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-400">Total:</span>
                            <span class="px-3 py-1 bg-gray-50 rounded-lg text-sm font-bold text-gray-900"
                                th:text="${feedback.size()}">0</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50/50">
                                <tr>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        ID</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        Customer</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        Service</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        Rating</th>
                                    <th class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                                        Review</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">
                                        Date</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">
                                        View</th>
                                    <th
                                        class="px-6 py-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-right">
                                        Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-50">
                                <tr th:each="f : ${feedback}" class="hover:bg-gray-50/50 transition-colors group">
                                    <td class="px-6 py-4 text-sm font-bold text-gray-400" th:text="${f.id}"></td>
                                    <td class="px-6 py-4">
                                        <span class="text-sm font-bold text-gray-900"
                                            th:text="${f.user.name}">Customer</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="text-sm font-medium text-indigo-600"
                                            th:text="${f.booking.service.serviceName}">Service</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-1">
                                            <div class="icon-star-full text-yellow-400 text-xs"></div>
                                            <span class="text-sm font-bold text-gray-900" th:text="${f.rating}">5</span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="text-sm text-gray-600 leading-relaxed max-w-xs truncate group-hover:whitespace-normal group-hover:overflow-visible group-hover:max-w-md transition-all"
                                            th:text="${f.comment}">Comment</div>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"
                                            th:text="${#temporals.format(f.createdAt, 'dd-MM-yyyy HH:mm')}">Date</span>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <a th:href="@{'/admin/feedback/' + ${f.id} + '/view'}"
                                            class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
                                            Details <div class="icon-external-link text-xs"></div>
                                        </a>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button class="text-gray-400 hover:text-red-500 transition-colors">
                                            <div class="icon-trash-2 text-lg"></div>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:insert="~{admin-layout :: scripts}"></th:block>
</body>

</html>
