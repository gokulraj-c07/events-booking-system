<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Invoice Detail - Admin</title>
    <th:block th:replace="~{admin-layout :: head}"></th:block>
</head>

<body class="bg-gray-50 font-sans text-gray-900 antialiased overflow-x-hidden">
    <div class="flex min-h-screen">
        <aside th:replace="~{admin-layout :: sidebar}"></aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header th:replace="~{admin-layout :: topbar}"></header>

            <main class="flex-1 p-8 overflow-y-auto">
                <div class="mb-10">
                    <a href="/admin/bills"
                        class="text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-indigo-600 transition-colors flex items-center gap-2 mb-2">
                        <div class="icon-arrow-left"></div> Back to Invoices
                    </a>
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">System Invoice Ledger</h1>
                </div>

                <div class="max-w-2xl mx-auto">
                    <div class="bg-white rounded-3xl border border-gray-100 shadow-2xl p-12 relative overflow-hidden">
                        <!-- Watermark -->
                        <div class="absolute -right-16 -top-16 w-64 h-64 bg-indigo-50/30 rounded-full blur-3xl"></div>

                        <div class="relative">
                            <div class="flex items-center justify-between mb-16">
                                <div>
                                    <div class="text-2xl font-black text-gray-900">EVENT<span
                                            class="text-indigo-600">HUB</span></div>
                                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">
                                        Official Payment Record</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Invoice
                                        Number</div>
                                    <div class="text-xl font-bold text-gray-900" th:text="${bill.invoiceNumber}">INV-000
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-12 mb-16">
                                <div>
                                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">Bill
                                        To</div>
                                    <div class="text-sm font-bold text-gray-900" th:text="${bill.booking.user.name}">
                                        Customer Name</div>
                                    <div class="text-xs text-gray-500 mt-1" th:text="${bill.booking.user.emailId}">
                                        customer@example.com</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">
                                        Issued Date</div>
                                    <div class="text-sm font-bold text-gray-900" th:text="${bill.date}">Date</div>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-2xl p-6 mb-16">
                                <div
                                    class="flex items-center justify-between text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4 px-2">
                                    <span>Description</span>
                                    <span>Amount</span>
                                </div>
                                <div
                                    class="flex items-center justify-between py-4 border-t border-gray-200/50 px-2 font-bold text-gray-900">
                                    <div class="flex items-center gap-3">
                                        <div
                                            class="w-8 h-8 rounded-lg bg-indigo-100/50 flex items-center justify-center text-indigo-600">
                                            <div class="icon-zap-bolt"></div>
                                        </div>
                                        <div>
                                            <div class="text-sm" th:text="${bill.booking.service.serviceName}">Service
                                                Name</div>
                                            <div class="text-[10px] text-gray-400 font-medium">Booking ID: #<span
                                                    th:text="${bill.booking.bookingId}"></span></div>
                                        </div>
                                    </div>
                                    <div class="text-sm" th:text="'₹' + ${bill.amount}">₹0</div>
                                </div>
                            </div>

                            <div class="space-y-4 text-right">
                                <div class="flex items-center justify-end gap-12 text-sm text-gray-500">
                                    <span>Subtotal</span>
                                    <span class="font-bold text-gray-900" th:text="'₹' + ${bill.amount}">₹0</span>
                                </div>
                                <div class="pt-4 border-t border-gray-200">
                                    <div class="flex items-center justify-end gap-12">
                                        <div class="text-xs font-bold text-gray-400 uppercase tracking-widest">Grand
                                            Total</div>
                                        <div class="text-3xl font-black text-indigo-600" th:text="'₹' + ${bill.amount}">
                                            ₹0</div>
                                    </div>
                                </div>
                                <div class="pt-8">
                                    <div th:switch="${bill.status}">
                                        <div th:case="'PAID'"
                                            class="inline-flex items-center gap-2 px-6 py-2 bg-green-500 text-white rounded-full text-xs font-bold uppercase tracking-widest uppercase">
                                            <div class="icon-check-circle"></div> Paid & Settled
                                        </div>
                                        <div th:case="*"
                                            class="inline-flex items-center gap-2 px-6 py-2 bg-amber-500 text-white rounded-full text-xs font-bold uppercase tracking-widest uppercase">
                                            <div class="icon-clock"></div> <span th:text="${bill.status}">Status</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:insert="~{admin-layout :: scripts}"></th:block>
</body>

</html>
